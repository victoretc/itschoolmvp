          - heading "Как учат в АйТи Скул" [level=2] [ref=f111e86]
          - paragraph [ref=f111e87]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f111e88]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f111e89]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f111e90]
          - generic [ref=f111e92]:
            - generic [ref=f111e93]:
              - generic [ref=f111e94]:
                - generic [aria-hidden] [ref=f111e95]: "01"
                - paragraph [ref=f111e96]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f111e97]:
                - generic [aria-hidden] [ref=f111e98]: "02"
                - paragraph [ref=f111e99]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f111e100]:
              - generic [ref=f111e101]: Наша главная цель
              - paragraph [ref=f111e102]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
