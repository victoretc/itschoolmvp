          - generic [ref=f15e75]:
            - generic [ref=f15e76]:
              - generic [ref=f15e77]:
                - generic [aria-hidden] [ref=f15e78]: "01"
                - paragraph [ref=f15e79]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f15e80]:
                - generic [aria-hidden] [ref=f15e81]: "02"
                - paragraph [ref=f15e82]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f15e83]:
              - generic [ref=f15e84]: Наша главная цель
              - paragraph [ref=f15e85]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
