      - generic [ref=e162]:
        - generic [ref=e163]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=e165]
          - paragraph [ref=e166]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=e167]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=e168]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=e169]
          - generic [ref=e171]:
            - generic [ref=e172]:
              - paragraph [ref=e175]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=e178]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=e179]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
