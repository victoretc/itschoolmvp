          - heading "Как учат в АйТи Скул" [level=2] [ref=f59e91]
          - paragraph [ref=f59e92]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f59e93]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f59e94]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f59e95]
          - generic [ref=f59e97]:
            - generic [ref=f59e98]:
              - generic [ref=f59e99]:
                - generic [aria-hidden] [ref=f59e100]: "01"
                - paragraph [ref=f59e101]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f59e102]:
                - generic [aria-hidden] [ref=f59e103]: "02"
                - paragraph [ref=f59e104]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f59e105]:
              - generic [ref=f59e106]: Наша главная цель
              - paragraph [ref=f59e107]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
