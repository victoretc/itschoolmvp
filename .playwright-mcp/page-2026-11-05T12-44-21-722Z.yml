              - heading "Развитие потенциала" [level=3] [ref=f668e127]
              - paragraph [ref=f668e128]: Работа с компьютером это инструмент интеллектуальной работы, помогающий в развитии интеллектуально-творческого потенциала личности, что позволит быстрее адаптироваться к различным условиям жизни, находить нестандартные решения любых возникающих задач.
