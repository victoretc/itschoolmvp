              - generic [ref=f2e99]:
                - generic [aria-hidden] [ref=f2e100]: "01"
                - paragraph [ref=f2e101]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f2e102]:
                - generic [aria-hidden] [ref=f2e103]: "02"
                - paragraph [ref=f2e104]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f2e105]:
              - text: Наша главная цель
