          - generic [ref=f2e75]:
            - generic [ref=f2e76]:
              - generic [ref=f2e77]:
                - generic [aria-hidden] [ref=f2e78]: "01"
                - paragraph [ref=f2e79]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f2e80]:
                - generic [aria-hidden] [ref=f2e81]: "02"
                - paragraph [ref=f2e82]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f2e83]:
              - text: Наша главная цель
              - paragraph [ref=f2e84]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
