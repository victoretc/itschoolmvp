            - paragraph [ref=f161e165]: Подход
            - heading "Как учат в АйТи Скул" [level=2] [ref=f161e166]
          - paragraph [ref=f161e167]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f161e168]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f161e169]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f161e170]
          - generic [ref=f161e172]:
            - generic [ref=f161e173]:
              - paragraph [ref=f161e176]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f161e179]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f161e180]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
    - region [ref=f161e181]:
