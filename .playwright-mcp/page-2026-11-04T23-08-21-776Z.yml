          - generic [ref=f122e163]:
            - generic [ref=f122e164]:
              - paragraph [ref=f122e167]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f122e170]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f122e171]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
