            - generic [ref=f397e127]:
              - generic [ref=f397e128]:
                - generic [aria-hidden] [ref=f397e129]: "01"
                - paragraph [ref=f397e130]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f397e131]:
                - generic [aria-hidden] [ref=f397e132]: "02"
                - paragraph [ref=f397e133]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f397e134]:
              - generic [ref=f397e135]: Наша главная цель
