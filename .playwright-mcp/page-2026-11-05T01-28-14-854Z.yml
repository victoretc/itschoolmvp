          - heading "Как учат в АйТи Скул" [level=2] [ref=f19e91]
          - paragraph [ref=f19e92]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f19e93]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f19e94]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f19e95]
          - generic [ref=f19e97]:
            - generic [ref=f19e98]:
              - generic [ref=f19e99]:
                - generic [aria-hidden] [ref=f19e100]: "01"
                - paragraph [ref=f19e101]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f19e102]:
                - generic [aria-hidden] [ref=f19e103]: "02"
                - paragraph [ref=f19e104]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f19e105]:
              - generic [ref=f19e106]: Наша главная цель
              - paragraph [ref=f19e107]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
