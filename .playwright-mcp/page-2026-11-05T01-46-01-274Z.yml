          - heading "Как учат в АйТи Скул" [level=2] [ref=f85e87]
          - paragraph [ref=f85e88]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f85e89]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f85e90]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f85e91]
          - generic [ref=f85e93]:
            - generic [ref=f85e94]:
              - generic [ref=f85e95]:
                - generic [aria-hidden] [ref=f85e96]: "01"
                - paragraph [ref=f85e97]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f85e98]:
                - generic [aria-hidden] [ref=f85e99]: "02"
                - paragraph [ref=f85e100]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f85e101]:
              - generic [ref=f85e102]: Наша главная цель
              - paragraph [ref=f85e103]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
