              - generic [ref=f329e130]:
                - generic [aria-hidden] [ref=f329e131]: "01"
                - paragraph [ref=f329e132]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f329e133]:
                - generic [aria-hidden] [ref=f329e134]: "02"
                - paragraph [ref=f329e135]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f329e136]:
              - generic [ref=f329e137]: Наша главная цель
