        - heading "Добро пожаловать в АйТи Скул!" [level=2] [ref=f515e27]
        - generic [ref=f515e28]:
          - generic [ref=f515e29]:
            - paragraph [ref=f515e30]: Здесь ваши дети откроют для себя увлекательный мир современной робототехники и в непринужденной игровой форме начнут осваивать искусство программирования.
            - paragraph [ref=f515e31]: Мы выбираем для работы с детьми сертифицированную робототехнику LEGO (WeDo, WeDo 2.0, Mindstorms EV3 и др.) — ведь это прежде всего весело, а положительные эмоции крайне важны для успешного закрепления полученных ребенком знаний.
            - paragraph [ref=f515e32]: "Каждый ребенок любит фантазировать. С помощью специальных наборов для роботостроения, разработанных компанией LEGO, ваши дети смогут воплотить свои фантазии на совершенно новом уровне: придумать собственного робота, собрать его и «вдохнуть в него жизнь» — то есть запрограммировать на выполнение определенных действий."
          - link "Получить консультацию" [ref=f515e34] [cursor=pointer]:
            - /url: /contacts/
    - region [ref=f515e37]:
      - generic [ref=f515e38]:
        - generic [ref=f515e39]:
          - heading "Обучение через действие" [level=2] [ref=f515e40]
          - paragraph [ref=f515e41]: вот основной принцип работы АйТи Скул
        - generic [ref=f515e42]:
          - paragraph [ref=f515e43]: Одно дело — наблюдать за подвигами трансформеров на экране домашнего кинотеатра или рисовать собственных. И совсем другое — самому собрать робот-бульдозер, заложить в него программу действий и радоваться тому, как он справляется с порученной работой.
          - paragraph [ref=f515e44]: Научный подход, инженерное мышление, логика и творчество — формирование этих навыков является основным результатом обучения у нас. Кроме этого, ваши дети познакомятся с тем, как устроена и как работает IT-индустрия, получат важный опыт командной работы, изучат основные принципы и алгоритмы программирования.
