            - generic [aria-hidden] [ref=f95e69]: "01"
            - heading "Развитие потенциала" [level=3] [ref=f95e70]
            - paragraph [ref=f95e71]: Работа с компьютером это инструмент интеллектуальной работы, помогающий в развитии интеллектуально-творческого потенциала личности, что позволит быстрее адаптироваться к различным условиям жизни, находить нестандартные решения любых возникающих задач.
          - generic [ref=f95e72]:
            - generic [aria-hidden] [ref=f95e73]: "02"
            - heading "Профориентация" [level=3] [ref=f95e74]
            - paragraph [ref=f95e75]: "Курс построен таким образом, что тинейджеры могут попробовать себя в разных ролях в IT: от тестировщика до программиста."
          - generic [ref=f95e76]:
