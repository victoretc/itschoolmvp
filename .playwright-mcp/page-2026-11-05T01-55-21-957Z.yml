            - generic [ref=f141e97]:
              - generic [ref=f141e98]:
                - generic [aria-hidden] [ref=f141e99]: "01"
                - paragraph [ref=f141e100]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f141e101]:
                - generic [aria-hidden] [ref=f141e102]: "02"
                - paragraph [ref=f141e103]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f141e104]:
              - generic [ref=f141e105]: Наша главная цель
              - paragraph [ref=f141e106]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
