        - generic [ref=f439e118]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=f439e120]
          - paragraph [ref=f439e121]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f439e122]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f439e123]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f439e124]
          - generic [ref=f439e126]:
            - generic [ref=f439e127]:
              - generic [ref=f439e128]:
                - generic [aria-hidden] [ref=f439e129]: "01"
                - paragraph [ref=f439e130]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f439e131]:
                - generic [aria-hidden] [ref=f439e132]: "02"
                - paragraph [ref=f439e133]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f439e135]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
