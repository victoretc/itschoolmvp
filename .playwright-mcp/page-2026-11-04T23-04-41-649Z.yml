          - generic [ref=f115e305]:
            - generic [ref=f115e307]:
              - heading "Больше об АйТи Скул" [level=2] [ref=f115e654]
              - generic [ref=f115e656]:
                - paragraph [ref=f115e657]: Педагогическим коллективом АйТи Скул разработаны программы курсов робототехники, уже на протяжении пяти лет мы совершенствуем нашу методику преподавания.
                - paragraph [ref=f115e658]: Наши методические материалы и рабочие тетради получили рецензию заведующего кафедрой общей и теоретической физики Брестского государственного университета имени А. С. Пушкина.
                - paragraph [ref=f115e659]: Каждое занятие в АйТи Скул не просто сборка модели и программирование, это ещё и новая тема, ребята изучают различные механизмы,узнают для чего они были созданы, как работают, и только потом собирают похожую модель из конструкторов.
