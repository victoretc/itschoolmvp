          - heading "Для чего ребёнку компьютерное образование?" [level=2] [ref=f161e185]
        - generic [ref=f161e186]:
          - generic [ref=f161e187]:
            - heading "Развитие потенциала" [level=3] [ref=f161e192]
            - paragraph [ref=f161e193]: Работа с компьютером — инструмент интеллектуальной работы. Она развивает интеллектуально-творческий потенциал личности, помогает быстрее адаптироваться к разным условиям и находить нестандартные решения.
          - generic [ref=f161e194]:
            - heading "Профориентация" [level=3] [ref=f161e199]
            - paragraph [ref=f161e200]: "Курс построен так, что подростки могут попробовать себя в разных ролях в IT: от тестировщика до программиста."
          - generic [ref=f161e201]:
            - heading "Ранний старт в IT" [level=3] [ref=f161e208]
            - paragraph [ref=f161e209]: Ребята получают реальный опыт и свою первую профессию ещё в школе, создавая и развивая настоящий проект.
    - region [ref=f161e210]:
