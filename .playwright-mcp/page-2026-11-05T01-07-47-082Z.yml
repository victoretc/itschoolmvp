          - paragraph [ref=f41e386]: Главный ключ к развитию — любопытство. Мы создаем пространство, где дети выбирают то, что им интересно, не боятся ошибаться, что их отругают, и совершают открытия.
        - article [ref=f41e387]:
          - heading "Постоянная практика" [level=3] [ref=f41e388]
          - paragraph [ref=f41e389]: Только практика превращает знания в навыки. Поэтому мы работаем над настоящими проектами, разбивая их на понятные шаги. Маленькие победы помогают видеть прогресс и не терять мотивацию.
        - article [ref=f41e390]:
          - heading "Путь важнее пункта назначения" [level=3] [ref=f41e391]
          - paragraph [ref=f41e392]: "У нас нет «правильно» и «неправильно», нет плохих и хороших оценок. Лучший путь к результату — фокус на процессе: если ребенку интересно, он достигает большего и получает устойчивый прогресс."
        - article [ref=f41e393]:
