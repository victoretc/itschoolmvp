          - heading "Как учат в АйТи Скул" [level=2] [ref=f51e89]
          - paragraph [ref=f51e90]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f51e91]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f51e92]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f51e93]
          - generic [ref=f51e95]:
            - generic [ref=f51e96]:
              - generic [ref=f51e97]:
                - generic [aria-hidden] [ref=f51e98]: "01"
                - paragraph [ref=f51e99]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f51e100]:
                - generic [aria-hidden] [ref=f51e101]: "02"
                - paragraph [ref=f51e102]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f51e103]:
              - generic [ref=f51e104]: Наша главная цель
              - paragraph [ref=f51e105]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
