          - heading "Как учат в АйТи Скул" [level=2] [ref=f8e69]
          - paragraph [ref=f8e70]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f8e71]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f8e72]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f8e73]
          - generic [ref=f8e75]:
            - generic [ref=f8e76]:
              - paragraph [ref=f8e79]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f8e82]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f8e83]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
