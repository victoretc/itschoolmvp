          - heading "Как учат в АйТи Скул" [level=2] [ref=e69]
          - paragraph [ref=e70]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=e71]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=e72]:
