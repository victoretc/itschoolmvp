          - heading "Отзывы о школе" [level=2] [ref=f115e666]
          - generic [ref=f115e330]:
            - generic [ref=f115e331]:
              - group "6 / 8" [ref=f115e533]:
                - generic [ref=f115e535]:
                  - generic [aria-hidden] [ref=f115e537]: 
                  - paragraph [ref=f115e539]: Довольна, что мой ребенок развивается на курсах в школе информационных технологий. Он очень любит работать с Lego и программировать те модели, которые собирает сам. Очень довольны работой преподавателя. Маленькое пожелание вам, хотелось бы чаще участвовать в различных соревнованиях.
                  - generic [ref=f115e542]:
                    - strong [ref=f115e543]: Юлия Витальевна Шахваладова
                    - text: Брест, 25-05-2019
              - group "7 / 8" [ref=f115e544]:
                - generic [ref=f115e546]:
                  - generic [aria-hidden] [ref=f115e548]: 
                  - paragraph [ref=f115e550]: "Мой сын, Максимук Никита, обучается сразу же на двух курсах: 3D-моделирование и робототехника. Очень довольна тем, что ребенок получает знания, которые пригодятся ему в будущем. Спасибо большое за актуальные направления, в которых ребёнок получает знания, а также за действительно полезную информацию, которая пригодится ему при выборе профессии."
                  - generic [ref=f115e553]:
                    - strong [ref=f115e554]: Марина Владимировна Максимук
                    - text: Кобрин, 25-05-2019
              - group "8 / 8" [ref=f115e555]:
                - generic [ref=f115e557]:
                  - generic [aria-hidden] [ref=f115e559]: 
                  - paragraph [ref=f115e561]: Ваш курс развивает мышление, навыки программирования, конечно, творчество. Моему ребенку очень нравится конструировать различных роботов. Ребенок доволен и счастлив, а соответственно я очень благодарна вам! Творческих успехов, новых идей!
                  - generic [ref=f115e564]:
                    - strong [ref=f115e565]: Наталья Владимировна Полховская
                    - text: Пинск, 25-05-2019
              - group "1 / 8" [ref=f115e566]:
                - generic [ref=f115e334]:
                  - generic [aria-hidden] [ref=f115e336]: 
                  - paragraph [ref=f115e338]: Мой сын, Левонюк Владислав, посещает Школу информационных технологий уже 2 года. Занимается с удовольствием. За это время открыл для себя много нового и интересного. нашел новых друзей. Отдельное огромное спасибо нашему педагогу Ангелине Викторовне. Она квалифицированный эрудированный специалист.
                  - generic [ref=f115e341]:
                    - strong [ref=f115e342]: Левонюк Владислав
                    - text: 02-11-2017
              - group "2 / 8" [ref=f115e567]:
                - generic [ref=f115e345]:
                  - generic [aria-hidden] [ref=f115e347]: 
                  - paragraph [ref=f115e349]: Наш сын Виноградов Лев занимается в школе ИТ второй год. Очень доволен занятиями, всегда очень ждет субботу, чтобы идти "на роботов". Ему нравятся темы, модели, которые собирают на занятиях. Также нам очень нравится наш преподаватель Светлана Александровна, второй год мы просим попасть именно в ее группу. Лёве нравится как она всё объясняет и как ко всем хорошо относится. От себя могу сказать, что сын стал более собранным, усидчивым, стал шире словарный запас. Младший сын очень ждет того момента, когда подрастет и сможет ходить "на роботов". Мы очень довольны школой ИТ и хотели бы продолжать посещать занятия и дальше.
                  - generic [ref=f115e352]:
                    - strong [ref=f115e353]: Виноградов Лев
                    - text: 02-04-2018
              - group "3 / 8" [ref=f115e568]:
                - generic [ref=f115e356]:
                  - generic [aria-hidden] [ref=f115e358]: 
                  - paragraph [ref=f115e360]: Мой ребенок, Книга Арсений, посещает с 6 лет Школу информационных технологий. От занятий по робототехнике всегда в восторге. Тур Светлана Александровна, преподаватель курса, индивидуально и креативно подходит к каждому учащемуся, доходчиво и доступно объясняет материал. Мы, родители, довольны уровнем уровнем образования, проводимыми мероприятиями (конкурсами, экскурсиями). Наши дети даже не хотят болеть, только б ходить на робототехнику, а это яркий показатель того, что Школа ИТ важна для наших детей! Успехов, творческой реализации и здоровья всем участникам образовательного процесса!Отзыв оставила мама Книга Арсения
                  - generic [ref=f115e363]:
                    - strong [ref=f115e364]: Книга Арсений
                    - text: 12-04-2018
              - group "4 / 8" [ref=f115e569]:
                - generic [ref=f115e367]:
                  - generic [aria-hidden] [ref=f115e369]: 
                  - paragraph [ref=f115e371]: Интересный и нетривиальный курс обучения, гибкий график, обратная связь с родителями, а также незабываемая поездка на фестиваль робототехники в г.Брест!Благодарна коллективу за индивидуальный подход, прогрессивно, в ногу со временем, всегда с пониманием относятся к разным обстоятельствам, предупредительны и вежливы.
                  - generic [ref=f115e374]:
                    - strong [ref=f115e375]: Анна Викторовна Куницкая
                    - text: Пинск, 25-05-2019
              - group "5 / 8" [ref=f115e570]:
                - generic [ref=f115e378]:
                  - generic [aria-hidden] [ref=f115e380]: 
                  - paragraph [ref=f115e382]: Спасибо огромное Школе Информационных Технологий за такой увлекательный и развивающий курс для детей. Я не могу знать, что происходит на занятиях, но для меня важно, что ребенок всегда с нетерпением ждет и радостно бежит на очередное занятие. Ему очень нравится. И, несмотря на то, что конструирование Lego можно рассматривать, как развлечение, но все же, как само по себе, так и вместе с созданием определенных компьютерных программ, данное занятие оказывает огромное влияние на развитие мышления и логики у детей. С удовольствием будем продолжать заниматься в следующем году. Только жаль что занятия проводятся один раз в неделю (мнение сына).
                  - generic [ref=f115e385]:
                    - strong [ref=f115e386]: Наталья Валентиновна Ступакова
                    - text: Пинск, 25-05-2019
              - group "6 / 8" [ref=f115e571]:
                - generic [ref=f115e389]:
                  - generic [aria-hidden] [ref=f115e391]: 
                  - paragraph [ref=f115e393]: Довольна, что мой ребенок развивается на курсах в школе информационных технологий. Он очень любит работать с Lego и программировать те модели, которые собирает сам. Очень довольны работой преподавателя. Маленькое пожелание вам, хотелось бы чаще участвовать в различных соревнованиях.
                  - generic [ref=f115e396]:
                    - strong [ref=f115e397]: Юлия Витальевна Шахваладова
                    - text: Брест, 25-05-2019
              - group "7 / 8" [ref=f115e572]:
                - generic [ref=f115e400]:
                  - generic [aria-hidden] [ref=f115e402]: 
                  - paragraph [ref=f115e404]: "Мой сын, Максимук Никита, обучается сразу же на двух курсах: 3D-моделирование и робототехника. Очень довольна тем, что ребенок получает знания, которые пригодятся ему в будущем. Спасибо большое за актуальные направления, в которых ребёнок получает знания, а также за действительно полезную информацию, которая пригодится ему при выборе профессии."
                  - generic [ref=f115e407]:
                    - strong [ref=f115e408]: Марина Владимировна Максимук
                    - text: Кобрин, 25-05-2019
              - group "8 / 8" [ref=f115e573]:
                - generic [ref=f115e411]:
                  - generic [aria-hidden] [ref=f115e413]: 
                  - paragraph [ref=f115e415]: Ваш курс развивает мышление, навыки программирования, конечно, творчество. Моему ребенку очень нравится конструировать различных роботов. Ребенок доволен и счастлив, а соответственно я очень благодарна вам! Творческих успехов, новых идей!
                  - generic [ref=f115e418]:
                    - strong [ref=f115e419]: Наталья Владимировна Полховская
                    - text: Пинск, 25-05-2019
              - group "1 / 8" [ref=f115e574]:
                - generic [ref=f115e576]:
                  - generic [aria-hidden] [ref=f115e578]: 
                  - paragraph [ref=f115e580]: Мой сын, Левонюк Владислав, посещает Школу информационных технологий уже 2 года. Занимается с удовольствием. За это время открыл для себя много нового и интересного. нашел новых друзей. Отдельное огромное спасибо нашему педагогу Ангелине Викторовне. Она квалифицированный эрудированный специалист.
                  - generic [ref=f115e583]:
                    - strong [ref=f115e584]: Левонюк Владислав
                    - text: 02-11-2017
              - group "2 / 8" [ref=f115e585]:
                - generic [ref=f115e587]:
                  - generic [aria-hidden] [ref=f115e589]: 
                  - paragraph [ref=f115e591]: Наш сын Виноградов Лев занимается в школе ИТ второй год. Очень доволен занятиями, всегда очень ждет субботу, чтобы идти "на роботов". Ему нравятся темы, модели, которые собирают на занятиях. Также нам очень нравится наш преподаватель Светлана Александровна, второй год мы просим попасть именно в ее группу. Лёве нравится как она всё объясняет и как ко всем хорошо относится. От себя могу сказать, что сын стал более собранным, усидчивым, стал шире словарный запас. Младший сын очень ждет того момента, когда подрастет и сможет ходить "на роботов". Мы очень довольны школой ИТ и хотели бы продолжать посещать занятия и дальше.
                  - generic [ref=f115e594]:
                    - strong [ref=f115e595]: Виноградов Лев
                    - text: 02-04-2018
              - group "3 / 8" [ref=f115e596]:
                - generic [ref=f115e598]:
                  - generic [aria-hidden] [ref=f115e600]: 
                  - paragraph [ref=f115e602]: Мой ребенок, Книга Арсений, посещает с 6 лет Школу информационных технологий. От занятий по робототехнике всегда в восторге. Тур Светлана Александровна, преподаватель курса, индивидуально и креативно подходит к каждому учащемуся, доходчиво и доступно объясняет материал. Мы, родители, довольны уровнем уровнем образования, проводимыми мероприятиями (конкурсами, экскурсиями). Наши дети даже не хотят болеть, только б ходить на робототехнику, а это яркий показатель того, что Школа ИТ важна для наших детей! Успехов, творческой реализации и здоровья всем участникам образовательного процесса!Отзыв оставила мама Книга Арсения
                  - generic [ref=f115e605]:
                    - strong [ref=f115e606]: Книга Арсений
                    - text: 12-04-2018
