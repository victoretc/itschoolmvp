          - heading "Как учат в АйТи Скул" [level=2] [ref=f79e91]
          - paragraph [ref=f79e92]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f79e93]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f79e94]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f79e95]
          - generic [ref=f79e97]:
            - generic [ref=f79e98]:
              - generic [ref=f79e99]:
                - generic [aria-hidden] [ref=f79e100]: "01"
                - paragraph [ref=f79e101]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f79e102]:
                - generic [aria-hidden] [ref=f79e103]: "02"
                - paragraph [ref=f79e104]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f79e105]:
              - generic [ref=f79e106]: Наша главная цель
              - paragraph [ref=f79e107]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
