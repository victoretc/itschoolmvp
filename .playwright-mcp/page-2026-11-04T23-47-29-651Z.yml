            - heading "Развитие потенциала" [level=3] [ref=f14e191]
            - paragraph [ref=f14e192]: Работа с компьютером — инструмент интеллектуальной работы. Она развивает интеллектуально-творческий потенциал личности, помогает быстрее адаптироваться к разным условиям и находить нестандартные решения.
          - generic [ref=f14e193]:
            - heading "Профориентация" [level=3] [ref=f14e198]
            - paragraph [ref=f14e199]: "Курс построен так, что подростки могут попробовать себя в разных ролях в IT: от тестировщика до программиста."
