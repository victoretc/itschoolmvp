            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f2e147]
          - generic [ref=f2e149]:
            - generic [ref=f2e150]:
              - paragraph [ref=f2e153]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f2e156]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f2e157]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
