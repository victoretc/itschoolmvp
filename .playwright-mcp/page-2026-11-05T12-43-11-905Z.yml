    - region [ref=f662e94]:
      - generic [ref=f662e95]:
        - generic [ref=f662e96]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=f662e98]
          - paragraph [ref=f662e99]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f662e100]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f662e101]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f662e102]
          - generic [ref=f662e104]:
            - generic [ref=f662e105]:
              - generic [ref=f662e106]:
                - generic [aria-hidden] [ref=f662e107]: "01"
                - paragraph [ref=f662e108]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f662e109]:
                - generic [aria-hidden] [ref=f662e110]: "02"
                - paragraph [ref=f662e111]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f662e113]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
