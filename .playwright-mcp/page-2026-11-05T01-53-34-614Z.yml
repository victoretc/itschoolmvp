          - generic [ref=f113e70]:
            - generic [ref=f113e71]:
              - generic [ref=f113e72]:
                - generic [aria-hidden] [ref=f113e73]: "01"
                - paragraph [ref=f113e74]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f113e75]:
                - generic [aria-hidden] [ref=f113e76]: "02"
                - paragraph [ref=f113e77]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f113e78]:
              - generic [ref=f113e79]: Наша главная цель
