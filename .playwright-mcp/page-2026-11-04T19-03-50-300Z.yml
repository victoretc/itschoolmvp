          - generic [ref=e330]:
            - generic [ref=e331]:
              - group "6 / 8" [ref=e332]:
                - generic [ref=e334]:
                  - generic [aria-hidden] [ref=e336]: 
                  - paragraph [ref=e338]: Довольна, что мой ребенок развивается на курсах в школе информационных технологий. Он очень любит работать с Lego и программировать те модели, которые собирает сам. Очень довольны работой преподавателя. Маленькое пожелание вам, хотелось бы чаще участвовать в различных соревнованиях.
                  - generic [ref=e341]:
                    - strong [ref=e342]: Юлия Витальевна Шахваладова
                    - text: Брест, 25-05-2019
              - group "7 / 8" [ref=e343]:
                - generic [ref=e345]:
                  - generic [aria-hidden] [ref=e347]: 
                  - paragraph [ref=e349]: "Мой сын, Максимук Никита, обучается сразу же на двух курсах: 3D-моделирование и робототехника. Очень довольна тем, что ребенок получает знания, которые пригодятся ему в будущем. Спасибо большое за актуальные направления, в которых ребёнок получает знания, а также за действительно полезную информацию, которая пригодится ему при выборе профессии."
                  - generic [ref=e352]:
                    - strong [ref=e353]: Марина Владимировна Максимук
                    - text: Кобрин, 25-05-2019
              - group "8 / 8" [ref=e354]:
                - generic [ref=e356]:
                  - generic [aria-hidden] [ref=e358]: 
                  - paragraph [ref=e360]: Ваш курс развивает мышление, навыки программирования, конечно, творчество. Моему ребенку очень нравится конструировать различных роботов. Ребенок доволен и счастлив, а соответственно я очень благодарна вам! Творческих успехов, новых идей!
                  - generic [ref=e363]:
                    - strong [ref=e364]: Наталья Владимировна Полховская
                    - text: Пинск, 25-05-2019
              - group "1 / 8" [ref=e365]:
                - generic [ref=e367]:
                  - generic [aria-hidden] [ref=e369]: 
                  - paragraph [ref=e371]: Мой сын, Левонюк Владислав, посещает Школу информационных технологий уже 2 года. Занимается с удовольствием. За это время открыл для себя много нового и интересного. нашел новых друзей. Отдельное огромное спасибо нашему педагогу Ангелине Викторовне. Она квалифицированный эрудированный специалист.
                  - generic [ref=e374]:
                    - strong [ref=e375]: Левонюк Владислав
                    - text: 02-11-2017
              - group "2 / 8" [ref=e376]:
                - generic [ref=e378]:
                  - generic [aria-hidden] [ref=e380]: 
                  - paragraph [ref=e382]: Наш сын Виноградов Лев занимается в школе ИТ второй год. Очень доволен занятиями, всегда очень ждет субботу, чтобы идти "на роботов". Ему нравятся темы, модели, которые собирают на занятиях. Также нам очень нравится наш преподаватель Светлана Александровна, второй год мы просим попасть именно в ее группу. Лёве нравится как она всё объясняет и как ко всем хорошо относится. От себя могу сказать, что сын стал более собранным, усидчивым, стал шире словарный запас. Младший сын очень ждет того момента, когда подрастет и сможет ходить "на роботов". Мы очень довольны школой ИТ и хотели бы продолжать посещать занятия и дальше.
                  - generic [ref=e385]:
                    - strong [ref=e386]: Виноградов Лев
                    - text: 02-04-2018
              - group "3 / 8" [ref=e387]:
                - generic [ref=e389]:
                  - generic [aria-hidden] [ref=e391]: 
                  - paragraph [ref=e393]: Мой ребенок, Книга Арсений, посещает с 6 лет Школу информационных технологий. От занятий по робототехнике всегда в восторге. Тур Светлана Александровна, преподаватель курса, индивидуально и креативно подходит к каждому учащемуся, доходчиво и доступно объясняет материал. Мы, родители, довольны уровнем уровнем образования, проводимыми мероприятиями (конкурсами, экскурсиями). Наши дети даже не хотят болеть, только б ходить на робототехнику, а это яркий показатель того, что Школа ИТ важна для наших детей! Успехов, творческой реализации и здоровья всем участникам образовательного процесса!Отзыв оставила мама Книга Арсения
                  - generic [ref=e396]:
                    - strong [ref=e397]: Книга Арсений
                    - text: 12-04-2018
              - group "4 / 8" [ref=e398]:
                - generic [ref=e400]:
                  - generic [aria-hidden] [ref=e402]: 
                  - paragraph [ref=e404]: Интересный и нетривиальный курс обучения, гибкий график, обратная связь с родителями, а также незабываемая поездка на фестиваль робототехники в г.Брест!Благодарна коллективу за индивидуальный подход, прогрессивно, в ногу со временем, всегда с пониманием относятся к разным обстоятельствам, предупредительны и вежливы.
                  - generic [ref=e407]:
                    - strong [ref=e408]: Анна Викторовна Куницкая
                    - text: Пинск, 25-05-2019
              - group "5 / 8" [ref=e409]:
                - generic [ref=e411]:
                  - generic [aria-hidden] [ref=e413]: 
                  - paragraph [ref=e415]: Спасибо огромное Школе Информационных Технологий за такой увлекательный и развивающий курс для детей. Я не могу знать, что происходит на занятиях, но для меня важно, что ребенок всегда с нетерпением ждет и радостно бежит на очередное занятие. Ему очень нравится. И, несмотря на то, что конструирование Lego можно рассматривать, как развлечение, но все же, как само по себе, так и вместе с созданием определенных компьютерных программ, данное занятие оказывает огромное влияние на развитие мышления и логики у детей. С удовольствием будем продолжать заниматься в следующем году. Только жаль что занятия проводятся один раз в неделю (мнение сына).
                  - generic [ref=e418]:
                    - strong [ref=e419]: Наталья Валентиновна Ступакова
                    - text: Пинск, 25-05-2019
              - group "6 / 8" [ref=e420]:
                - generic [ref=e422]:
                  - generic [aria-hidden] [ref=e424]: 
                  - paragraph [ref=e426]: Довольна, что мой ребенок развивается на курсах в школе информационных технологий. Он очень любит работать с Lego и программировать те модели, которые собирает сам. Очень довольны работой преподавателя. Маленькое пожелание вам, хотелось бы чаще участвовать в различных соревнованиях.
