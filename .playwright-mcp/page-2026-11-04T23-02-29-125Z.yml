          - heading "Как учат в АйТи Скул" [level=2] [ref=f102e76]
          - paragraph [ref=f102e77]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f102e78]:
          - generic [ref=f102e79]:
            - generic [aria-hidden] [ref=f102e80]: "01"
            - paragraph [ref=f102e81]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
          - generic [ref=f102e82]:
            - generic [aria-hidden] [ref=f102e83]: "02"
            - paragraph [ref=f102e84]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
        - paragraph [ref=f102e85]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
