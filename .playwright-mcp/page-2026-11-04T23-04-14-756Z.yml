            - heading "Как учат в АйТи Скул" [level=2] [ref=f112e159]
          - paragraph [ref=f112e160]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
