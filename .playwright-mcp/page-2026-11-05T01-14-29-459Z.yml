        - generic [ref=f12e147]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=f12e149]
          - paragraph [ref=f12e150]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f12e151]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f12e152]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f12e153]
          - generic [ref=f12e155]:
            - generic [ref=f12e156]:
              - paragraph [ref=f12e159]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f12e162]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f12e163]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
