          - heading "Свобода и интерес" [level=3] [ref=f93e417]
          - paragraph [ref=f93e418]: Главный ключ к развитию — любопытство. Мы создаем пространство, где дети выбирают то, что им интересно, не боятся ошибаться, что их отругают, и совершают открытия.
        - article [ref=f93e419]:
          - heading "Постоянная практика" [level=3] [ref=f93e420]
          - paragraph [ref=f93e421]: Только практика превращает знания в навыки. Поэтому мы работаем над настоящими проектами, разбивая их на понятные шаги. Маленькие победы помогают видеть прогресс и не терять мотивацию.
        - article [ref=f93e422]:
          - heading "Путь важнее пункта назначения" [level=3] [ref=f93e423]
          - paragraph [ref=f93e424]: "У нас нет «правильно» и «неправильно», нет плохих и хороших оценок. Лучший путь к результату — фокус на процессе: если ребенку интересно, он достигает большего и получает устойчивый прогресс."
        - article [ref=f93e425]:
