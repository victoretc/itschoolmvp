          - heading "Как учат в АйТи Скул" [level=2] [ref=f13e91]
          - paragraph [ref=f13e92]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f13e93]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f13e94]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f13e95]
          - generic [ref=f13e97]:
            - generic [ref=f13e98]:
              - generic [ref=f13e99]:
                - generic [aria-hidden] [ref=f13e100]: "01"
                - paragraph [ref=f13e101]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f13e102]:
                - generic [aria-hidden] [ref=f13e103]: "02"
                - paragraph [ref=f13e104]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f13e105]:
              - generic [ref=f13e106]: Наша главная цель
              - paragraph [ref=f13e107]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
