            - heading "Как учат в АйТи Скул" [level=2] [ref=f118e156]
          - paragraph [ref=f118e157]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
