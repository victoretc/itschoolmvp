        - heading "Добро пожаловать в АйТи Скул!" [level=2] [ref=f648e49]
        - generic [ref=f648e50]:
          - generic [ref=f648e51]:
            - paragraph [ref=f648e52]: Здесь ваши дети откроют для себя увлекательный мир современной робототехники и в непринужденной игровой форме начнут осваивать искусство программирования.
            - paragraph [ref=f648e53]: Мы выбираем для работы с детьми сертифицированную робототехнику LEGO (WeDo, WeDo 2.0, Mindstorms EV3 и др.) — ведь это прежде всего весело, а положительные эмоции крайне важны для успешного закрепления полученных ребенком знаний.
            - paragraph [ref=f648e54]: "Каждый ребенок любит фантазировать. С помощью специальных наборов для роботостроения, разработанных компанией LEGO, ваши дети смогут воплотить свои фантазии на совершенно новом уровне: придумать собственного робота, собрать его и «вдохнуть в него жизнь» — то есть запрограммировать на выполнение определенных действий."
          - link "Получить консультацию" [ref=f648e56] [cursor=pointer]:
            - /url: /contacts/
    - region [ref=f648e59]:
      - generic [ref=f648e60]:
        - generic [ref=f648e61]:
          - heading "Обучение через действие" [level=2] [ref=f648e62]
          - paragraph [ref=f648e63]: вот основной принцип работы АйТи Скул
        - generic [ref=f648e64]:
          - paragraph [ref=f648e65]: Одно дело — наблюдать за подвигами трансформеров на экране домашнего кинотеатра или рисовать собственных. И совсем другое — самому собрать робот-бульдозер, заложить в него программу действий и радоваться тому, как он справляется с порученной работой.
          - paragraph [ref=f648e66]: Научный подход, инженерное мышление, логика и творчество — формирование этих навыков является основным результатом обучения у нас. Кроме этого, ваши дети познакомятся с тем, как устроена и как работает IT-индустрия, получат важный опыт командной работы, изучат основные принципы и алгоритмы программирования.
