    - region [ref=e123]:
      - generic [ref=e124]:
        - generic [ref=e125]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=e127]
          - paragraph [ref=e128]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=e129]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=e130]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=e131]
          - generic [ref=e133]:
            - generic [ref=e134]:
              - paragraph [ref=e137]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=e140]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=e141]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
