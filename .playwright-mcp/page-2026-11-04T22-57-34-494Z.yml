        - generic [ref=f91e75]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=f91e76]
          - paragraph [ref=f91e77]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f91e78]:
          - generic [ref=f91e79]:
            - generic [aria-hidden] [ref=f91e80]: "01"
            - paragraph [ref=f91e81]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
          - generic [ref=f91e82]:
            - generic [aria-hidden] [ref=f91e83]: "02"
            - paragraph [ref=f91e84]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
        - paragraph [ref=f91e85]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
    - region [ref=f91e86]:
      - generic [ref=f91e87]:
        - heading "Для чего ребенку компьютерное образование?" [level=2] [ref=f91e88]
        - generic [ref=f91e89]:
          - generic [ref=f91e90]:
            - text: "01"
            - heading "Развитие потенциала" [level=3] [ref=f91e91]
            - paragraph [ref=f91e92]: Работа с компьютером это инструмент интеллектуальной работы, помогающий в развитии интеллектуально-творческого потенциала личности, что позволит быстрее адаптироваться к различным условиям жизни, находить нестандартные решения любых возникающих задач.
          - generic [ref=f91e93]:
            - text: "02"
            - heading "Профориентация" [level=3] [ref=f91e94]
            - paragraph [ref=f91e95]: "Курс построен таким образом, что тинейджеры могут попробовать себя в разных ролях в IT: от тестировщика до программиста."
          - generic [ref=f91e96]:
            - text: "03"
            - heading "Ранний старт в IT" [level=3] [ref=f91e97]
