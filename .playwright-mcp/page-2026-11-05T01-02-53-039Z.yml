          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f26e166]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f26e167]
          - generic [ref=f26e169]:
            - generic [ref=f26e170]:
              - paragraph [ref=f26e173]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f26e176]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f26e177]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
