            - paragraph [ref=f16e170]: Работа с компьютером — инструмент интеллектуальной работы. Она развивает интеллектуально-творческий потенциал личности, помогает быстрее адаптироваться к разным условиям и находить нестандартные решения.
          - generic [ref=f16e171]:
            - heading "Профориентация" [level=3] [ref=f16e176]
            - paragraph [ref=f16e177]: "Курс построен так, что подростки могут попробовать себя в разных ролях в IT: от тестировщика до программиста."
