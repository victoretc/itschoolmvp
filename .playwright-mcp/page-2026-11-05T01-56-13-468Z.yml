            - generic [ref=f151e121]:
              - generic [ref=f151e122]:
                - generic [aria-hidden] [ref=f151e123]: "01"
                - paragraph [ref=f151e124]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f151e125]:
                - generic [aria-hidden] [ref=f151e126]: "02"
                - paragraph [ref=f151e127]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f151e128]:
              - generic [ref=f151e129]: Наша главная цель
              - paragraph [ref=f151e130]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
