          - heading "Как учат в АйТи Скул" [level=2] [ref=f38e144]
          - paragraph [ref=f38e145]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f38e146]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f38e147]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f38e148]
          - generic [ref=f38e150]:
            - generic [ref=f38e151]:
              - paragraph [ref=f38e154]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f38e157]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f38e158]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
