            - generic [ref=f470e126]:
              - heading "Развитие потенциала" [level=3] [ref=f470e127]
              - paragraph [ref=f470e128]: Работа с компьютером это инструмент интеллектуальной работы, помогающий в развитии интеллектуально-творческого потенциала личности, что позволит быстрее адаптироваться к различным условиям жизни, находить нестандартные решения любых возникающих задач.
          - article [ref=f470e129]:
