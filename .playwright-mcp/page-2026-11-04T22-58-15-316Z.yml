    - region [ref=f97e51]:
      - generic [ref=f97e52]:
        - generic [ref=f97e53]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=f97e54]
          - paragraph [ref=f97e55]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f97e56]:
          - generic [ref=f97e57]:
            - generic [aria-hidden] [ref=f97e58]: "01"
            - paragraph [ref=f97e59]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
          - generic [ref=f97e60]:
            - generic [aria-hidden] [ref=f97e61]: "02"
            - paragraph [ref=f97e62]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
        - paragraph [ref=f97e63]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
    - region [ref=f97e64]:
      - generic [ref=f97e65]:
        - heading "Для чего ребенку компьютерное образование?" [level=2] [ref=f97e66]
        - generic [ref=f97e67]:
          - generic [ref=f97e68]:
            - generic [aria-hidden] [ref=f97e69]: "01"
            - heading "Развитие потенциала" [level=3] [ref=f97e70]
            - paragraph [ref=f97e71]: Работа с компьютером это инструмент интеллектуальной работы, помогающий в развитии интеллектуально-творческого потенциала личности, что позволит быстрее адаптироваться к различным условиям жизни, находить нестандартные решения любых возникающих задач.
          - generic [ref=f97e72]:
            - generic [aria-hidden] [ref=f97e73]: "02"
            - heading "Профориентация" [level=3] [ref=f97e74]
            - paragraph [ref=f97e75]: "Курс построен таким образом, что тинейджеры могут попробовать себя в разных ролях в IT: от тестировщика до программиста."
          - generic [ref=f97e76]:
            - generic [aria-hidden] [ref=f97e77]: "03"
