          - heading "Как учат в АйТи Скул" [level=2] [ref=f6e91]
          - paragraph [ref=f6e92]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f6e93]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f6e94]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f6e95]
          - generic [ref=f6e97]:
            - generic [ref=f6e98]:
              - paragraph [ref=f6e101]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f6e104]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f6e105]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
