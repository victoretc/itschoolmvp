{{ define "main" }}
<section class="page">
  <h1 class="page__title">{{ .Title }}</h1>
  {{ with .Content }}<div class="page__content">{{ . }}</div>{{ end }}
  {{ with .Pages }}
  <ul class="page__list">
    {{ range . }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
  {{ end }}
</section>
{{ end }}
