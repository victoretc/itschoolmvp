        - article [ref=f34e419]:
          - heading "Постоянная практика" [level=3] [ref=f34e420]
          - paragraph [ref=f34e421]: Только практика превращает знания в навыки. Поэтому мы работаем над настоящими проектами, разбивая их на понятные шаги. Маленькие победы помогают видеть прогресс и не терять мотивацию.
        - article [ref=f34e422]:
