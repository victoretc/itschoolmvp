          - heading "Как учат в АйТи Скул" [level=2] [ref=f4e127]
          - paragraph [ref=f4e128]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f4e129]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f4e130]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f4e131]
          - generic [ref=f4e133]:
            - generic [ref=f4e134]:
              - paragraph [ref=f4e137]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f4e140]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f4e141]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
