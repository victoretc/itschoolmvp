            - heading "Как учат в АйТи Скул" [level=2] [ref=f115e613]
            - generic [ref=f115e615]:
              - paragraph [ref=f115e616]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
              - paragraph [ref=f115e617]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f115e618]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе. Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
          - generic [ref=f115e166]:
