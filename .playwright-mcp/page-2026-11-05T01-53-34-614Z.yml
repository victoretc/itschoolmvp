          - heading "Как учат в АйТи Скул" [level=2] [ref=f113e64]
          - paragraph [ref=f113e65]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
