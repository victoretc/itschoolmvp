          - heading "Как учат в АйТи Скул" [level=2] [ref=f105e54]
          - paragraph [ref=f105e55]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f105e56]:
          - generic [ref=f105e57]:
            - generic [aria-hidden] [ref=f105e58]: "01"
            - paragraph [ref=f105e59]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
          - generic [ref=f105e60]:
            - generic [aria-hidden] [ref=f105e61]: "02"
            - paragraph [ref=f105e62]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
        - paragraph [ref=f105e63]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
