            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f149e118]
          - generic [ref=f149e120]:
            - generic [ref=f149e121]:
              - generic [ref=f149e122]:
                - generic [aria-hidden] [ref=f149e123]: "01"
                - paragraph [ref=f149e124]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f149e125]:
                - generic [aria-hidden] [ref=f149e126]: "02"
                - paragraph [ref=f149e127]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f149e128]:
              - generic [ref=f149e129]: Наша главная цель
              - paragraph [ref=f149e130]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
