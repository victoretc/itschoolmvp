          - generic [ref=f167e128]:
            - generic [ref=f167e129]:
              - generic [ref=f167e130]:
                - generic [aria-hidden] [ref=f167e131]: "01"
                - paragraph [ref=f167e132]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f167e133]:
                - generic [aria-hidden] [ref=f167e134]: "02"
                - paragraph [ref=f167e135]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f167e136]:
              - generic [ref=f167e137]: Наша главная цель
              - paragraph [ref=f167e138]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
