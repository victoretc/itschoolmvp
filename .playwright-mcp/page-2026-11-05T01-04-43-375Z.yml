          - heading "Как учат в АйТи Скул" [level=2] [ref=f29e163]
          - paragraph [ref=f29e164]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f29e165]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f29e166]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f29e167]
          - generic [ref=f29e169]:
            - generic [ref=f29e170]:
              - paragraph [ref=f29e173]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f29e176]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f29e177]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
