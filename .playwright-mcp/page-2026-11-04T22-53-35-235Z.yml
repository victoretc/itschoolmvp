            - generic [aria-hidden] [ref=f82e80]: "01"
            - paragraph [ref=f82e81]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
          - generic [ref=f82e82]:
            - generic [aria-hidden] [ref=f82e83]: "02"
