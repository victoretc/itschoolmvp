          - heading "Как учат в АйТи Скул" [level=2] [ref=f3e162]
          - paragraph [ref=f3e163]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f3e164]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f3e165]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f3e166]
          - generic [ref=f3e168]:
            - generic [ref=f3e169]:
              - paragraph [ref=f3e172]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f3e175]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f3e176]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
