          - heading "Как учат в АйТи Скул" [level=2] [ref=f149e114]
          - paragraph [ref=f149e115]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f149e116]:
