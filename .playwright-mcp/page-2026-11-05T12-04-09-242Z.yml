    - region [ref=f461e94]:
      - generic [ref=f461e95]:
        - generic [ref=f461e96]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=f461e98]
          - paragraph [ref=f461e99]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f461e100]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f461e101]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f461e102]
          - generic [ref=f461e104]:
            - generic [ref=f461e105]:
              - generic [ref=f461e106]:
                - generic [aria-hidden] [ref=f461e107]: "01"
                - paragraph [ref=f461e108]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f461e109]:
                - generic [aria-hidden] [ref=f461e110]: "02"
                - paragraph [ref=f461e111]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f461e113]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
    - region [ref=f461e114]:
