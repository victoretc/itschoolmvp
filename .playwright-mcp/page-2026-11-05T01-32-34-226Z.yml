          - heading "Как учат в АйТи Скул" [level=2] [ref=f53e69]
          - paragraph [ref=f53e70]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
