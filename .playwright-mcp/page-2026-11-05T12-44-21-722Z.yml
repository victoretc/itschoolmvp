    - region [ref=f668e94]:
      - generic [ref=f668e95]:
        - generic [ref=f668e96]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=f668e98]
          - paragraph [ref=f668e99]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f668e100]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f668e101]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f668e102]
          - generic [ref=f668e104]:
            - generic [ref=f668e105]:
              - generic [ref=f668e106]:
                - generic [aria-hidden] [ref=f668e107]: "01"
                - paragraph [ref=f668e108]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f668e109]:
                - generic [aria-hidden] [ref=f668e110]: "02"
                - paragraph [ref=f668e111]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f668e113]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
    - region [ref=f668e114]:
