          - paragraph [ref=f106e47]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f106e48]:
          - generic [ref=f106e49]:
            - generic [aria-hidden] [ref=f106e50]: "01"
            - paragraph [ref=f106e51]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
          - generic [ref=f106e52]:
            - generic [aria-hidden] [ref=f106e53]: "02"
            - paragraph [ref=f106e54]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
        - paragraph [ref=f106e55]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
