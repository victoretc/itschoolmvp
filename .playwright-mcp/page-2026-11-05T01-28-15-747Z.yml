            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f17e73]
          - generic [ref=f17e75]:
            - generic [ref=f17e76]:
              - generic [ref=f17e77]:
                - generic [aria-hidden] [ref=f17e78]: "01"
                - paragraph [ref=f17e79]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f17e80]:
                - generic [aria-hidden] [ref=f17e81]: "02"
                - paragraph [ref=f17e82]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f17e83]:
              - generic [ref=f17e84]: Наша главная цель
              - paragraph [ref=f17e85]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
