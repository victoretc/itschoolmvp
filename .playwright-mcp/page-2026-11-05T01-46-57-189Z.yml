          - heading "Как учат в АйТи Скул" [level=2] [ref=f89e85]
          - paragraph [ref=f89e86]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
