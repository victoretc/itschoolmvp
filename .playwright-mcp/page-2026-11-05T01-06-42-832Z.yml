          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f37e166]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f37e167]
          - generic [ref=f37e169]:
            - generic [ref=f37e170]:
              - paragraph [ref=f37e173]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f37e176]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f37e177]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
