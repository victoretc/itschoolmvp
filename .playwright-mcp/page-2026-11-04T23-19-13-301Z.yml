          - heading "Отзывы о школе" [level=2] [ref=f161e214]
        - generic [ref=f161e215]:
          - article [ref=f161e216]:
            - generic [aria-hidden] [ref=f161e217]: “
            - paragraph [ref=f161e218]: Наш сын Виноградов Лев занимается в школе ИТ второй год. Очень доволен занятиями, всегда очень ждет субботу, чтобы идти на «роботов». Ему нравятся темы, модели, которые собирают на занятиях. Также нам очень нравится наш преподаватель Светлана Александровна, второй год мы просим попасть именно в ее группу. Леве нравится, как она все объясняет и как ко всем хорошо относится. От себя могу сказать, что сын стал более собранным, усидчивым, стал шире словарный запас. Младший сын очень ждет того момента, когда подрастет и сможет ходить «на роботов». Мы очень довольны новой школой ИТ и хотели бы продолжать посещать занятия и дальше.
            - generic [ref=f161e219]:
              - generic [ref=f161e220]: Виноградов Лев
              - generic [ref=f161e221]: апрель 2018
          - generic [ref=f161e222]:
            - article [ref=f161e223]:
              - generic [aria-hidden] [ref=f161e224]: “
              - paragraph [ref=f161e225]: Мой ребенок, Книга Арсений, посещает с 6 лет Школу информационных технологий. От занятий по робототехнике всегда в восторге. Светлана Александровна, преподаватель курса, индивидуально и креативно подходит к каждому учащемуся, доходчиво и доступно объясняет материал. Мы, родители, довольны уровнем образования, проводимыми мероприятиями (конкурсами, экскурсиями). Наши дети даже не хотят болеть, только бы ходить на робототехнику, а это яркий показатель того, что Школа ИТ важна для наших детей! Успехов, творческой реализации и здоровья всем участникам образовательного процесса!
              - generic [ref=f161e226]:
                - generic [ref=f161e227]: Книга Арсений
                - generic [ref=f161e228]: апрель 2018
            - article [ref=f161e229]:
              - generic [aria-hidden] [ref=f161e230]: “
              - paragraph [ref=f161e231]: Интересный и нетривиальный курс обучения, гибкий график, обратная связь с родителями, а также незабываемая поездка на фестиваль робототехники в г. Брест! Благодарна коллективу за индивидуальный подход, прогрессивно, в ногу со временем, всегда с пониманием относятся к разным обстоятельствам, предупредительны и вежливы.
              - generic [ref=f161e232]:
                - generic [ref=f161e233]: Анна Викторовна Куницкая
                - generic [ref=f161e234]: Пинск, 2019
