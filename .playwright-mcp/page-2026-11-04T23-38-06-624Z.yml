            - heading "Как учат в АйТи Скул" [level=2] [ref=f11e168]
          - paragraph [ref=f11e169]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f11e170]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f11e171]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f11e172]
          - generic [ref=f11e174]:
            - generic [ref=f11e175]:
              - paragraph [ref=f11e178]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f11e181]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f11e182]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
