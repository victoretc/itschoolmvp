          - heading "Как учат в АйТи Скул" [level=2] [ref=f9e141]
          - paragraph [ref=f9e142]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f9e143]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f9e144]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f9e145]
          - generic [ref=f9e147]:
            - generic [ref=f9e148]:
              - paragraph [ref=f9e151]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f9e154]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f9e155]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
