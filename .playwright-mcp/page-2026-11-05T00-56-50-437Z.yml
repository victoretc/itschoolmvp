          - heading "Как учат в АйТи Скул" [level=2] [ref=f5e140]
          - paragraph [ref=f5e141]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f5e142]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f5e143]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f5e144]
          - generic [ref=f5e146]:
            - generic [ref=f5e147]:
              - paragraph [ref=f5e150]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f5e153]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f5e154]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
