              - generic [ref=f353e128]:
                - generic [aria-hidden] [ref=f353e129]: "01"
                - paragraph [ref=f353e130]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f353e131]:
                - generic [aria-hidden] [ref=f353e132]: "02"
                - paragraph [ref=f353e133]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
