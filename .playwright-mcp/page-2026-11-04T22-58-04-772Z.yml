            - generic [aria-hidden] [ref=f96e69]: "01"
            - heading "Развитие потенциала" [level=3] [ref=f96e70]
            - paragraph [ref=f96e71]: Работа с компьютером это инструмент интеллектуальной работы, помогающий в развитии интеллектуально-творческого потенциала личности, что позволит быстрее адаптироваться к различным условиям жизни, находить нестандартные решения любых возникающих задач.
          - generic [ref=f96e72]:
