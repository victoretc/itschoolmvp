              - generic [ref=f173e111]:
                - generic [aria-hidden] [ref=f173e112]: "02"
                - paragraph [ref=f173e113]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
