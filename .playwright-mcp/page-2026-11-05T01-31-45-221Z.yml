          - generic [ref=f10e75]:
            - generic [ref=f10e76]:
              - generic [ref=f10e77]:
                - generic [aria-hidden] [ref=f10e78]: "01"
                - paragraph [ref=f10e79]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f10e80]:
                - generic [aria-hidden] [ref=f10e81]: "02"
                - paragraph [ref=f10e82]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f10e83]:
              - generic [ref=f10e84]: Наша главная цель
              - paragraph [ref=f10e85]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
