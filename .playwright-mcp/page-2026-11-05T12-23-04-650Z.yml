        - generic [ref=f472e116]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=f472e118]
          - paragraph [ref=f472e119]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f472e120]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f472e121]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f472e122]
          - generic [ref=f472e124]:
            - generic [ref=f472e125]:
              - generic [ref=f472e126]:
                - generic [aria-hidden] [ref=f472e127]: "01"
                - paragraph [ref=f472e128]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f472e129]:
                - generic [aria-hidden] [ref=f472e130]: "02"
                - paragraph [ref=f472e131]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f472e133]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
