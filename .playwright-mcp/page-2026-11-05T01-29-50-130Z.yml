              - generic [ref=e77]:
                - generic [aria-hidden] [ref=e78]: "01"
                - paragraph [ref=e79]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=e80]:
                - generic [aria-hidden] [ref=e81]: "02"
                - paragraph [ref=e82]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=e83]:
              - generic [ref=e84]: Наша главная цель
