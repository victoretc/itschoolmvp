    - region [ref=f16e140]:
      - generic [ref=f16e141]:
        - generic [ref=f16e142]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=f16e144]
          - paragraph [ref=f16e145]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f16e146]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f16e147]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f16e148]
          - generic [ref=f16e150]:
            - generic [ref=f16e151]:
              - paragraph [ref=f16e154]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f16e157]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f16e158]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
    - region [ref=f16e159]:
