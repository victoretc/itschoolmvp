            - generic [ref=f515e85]:
              - generic [aria-hidden] [ref=f515e86]: "01"
              - generic [ref=f515e87]:
                - heading "Робототехника в образовании" [level=3] [ref=f515e88]
                - paragraph [ref=f515e89]: Робототехника, или конструирование роботов — инновационное направление в современном образовании школьников. Часто его обозначают термином LEGO-конструирование, потому что именно компания LEGO, известный мировой производитель детских конструкторов, является основным разработчиком наборов для робототехнического конструирования (LEGO WeDo, WeDo 2.0, Mindstorms EV3). Еще одной популярной платформой для изучения робототехники является Arduino — она пользуется популярностью у любознательных школьников, студентов и изобретателей по всему миру.
            - generic [ref=f515e90]:
              - generic [aria-hidden] [ref=f515e91]: "02"
              - generic [ref=f515e92]:
                - heading "Что дает робототехника вашему ребенку" [level=3] [ref=f515e93]
                - paragraph [ref=f515e94]: В АйТи Скул дети с младшего школьного возраста приобщаются к научно-техническому творчеству, осваивают базовые языки программирования — и всё это в лёгкой, вовлекающей игровой форме, что значительно повышает эффективность обучения. Кроме этого, занятия робототехникой обеспечивают всестороннее и гармоничное развитие вашего ребенка. Конструируя автоматизированные механизмы и экспериментируя с ними, дети решают творческие задачи, которые лежат на пересечении таких серьезных дисциплин как физика, математика, механика, программирование. Применяя теорию на практике, дети получают конкретный результат, что усиливает их мотивацию к дальнейшему обучению.
            - generic [ref=f515e95]:
              - generic [aria-hidden] [ref=f515e96]: "03"
              - generic [ref=f515e97]:
                - heading "АйТи Скул" [level=3] [ref=f515e98]
                - paragraph [ref=f515e99]: Возможно, вы уже знаете о том, что на базе Брестского государственного технического университета действует лаборатория робототехники, признанная ведущей в Республике Беларусь. Но у обычных школьников до недавнего времени было не так много возможностей для занятий робототехникой — и поэтому в 2016 году мы открыли АйТи Скул, где основное внимание уделяется этому направлению. Мы предлагаем вам и вашим детям не только большой выбор курсов для обучения IT-специальностям, но и единую последовательную систему подготовки юного IT-специалиста. Занятия в АйТи Скул нацелены на формирование у детей четкого представления о конкретных IT-профессиях с возможностью дальнейшей — углубленной — профориентации.
