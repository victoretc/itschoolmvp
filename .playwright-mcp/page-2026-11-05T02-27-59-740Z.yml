          - heading "Как учат в АйТи Скул" [level=2] [ref=f337e122]
          - paragraph [ref=f337e123]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
