              - generic [ref=f127e97]:
                - generic [aria-hidden] [ref=f127e98]: "02"
                - paragraph [ref=f127e99]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
