            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f4e73]
          - generic [ref=f4e75]:
            - generic [ref=f4e76]:
              - generic [ref=f4e77]:
                - generic [aria-hidden] [ref=f4e78]: "01"
                - paragraph [ref=f4e79]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f4e80]:
                - generic [aria-hidden] [ref=f4e81]: "02"
                - paragraph [ref=f4e82]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f4e83]:
              - text: Наша главная цель
              - paragraph [ref=f4e84]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
