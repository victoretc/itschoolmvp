          - generic [ref=f86e79]:
            - generic [aria-hidden] [ref=f86e80]: "01"
            - paragraph [ref=f86e81]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
          - generic [ref=f86e82]:
            - generic [aria-hidden] [ref=f86e83]: "02"
