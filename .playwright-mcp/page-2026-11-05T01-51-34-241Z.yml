            - generic [ref=f91e92]:
              - generic [ref=f91e93]:
                - generic [aria-hidden] [ref=f91e94]: "01"
                - paragraph [ref=f91e95]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f91e96]:
                - generic [aria-hidden] [ref=f91e97]: "02"
                - paragraph [ref=f91e98]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f91e99]:
              - generic [ref=f91e100]: Наша главная цель
              - paragraph [ref=f91e101]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
