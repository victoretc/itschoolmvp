          - generic [ref=f427e275]:
            - paragraph [ref=f427e276]: Педагогическим коллективом АйТи Скул разработаны программы курсов робототехники. Уже на протяжении пяти лет мы совершенствуем нашу методику преподавания.
            - paragraph [ref=f427e277]: Наши методические материалы и рабочие тетради получили рецензию заведующего кафедрой общей и теоретической физики Брестского государственного университета имени А. С. Пушкина.
            - paragraph [ref=f427e278]: "Каждое занятие в АйТи Скул — не просто сборка модели и программирование. Это ещё и новая тема: ребята изучают различные механизмы, узнают, для чего они были созданы, как работают, и только потом собирают похожую модель из конструкторов."
