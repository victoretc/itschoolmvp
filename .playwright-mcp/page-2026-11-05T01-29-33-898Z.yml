          - heading "Как учат в АйТи Скул" [level=2] [ref=f2e69]
          - paragraph [ref=f2e70]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f2e71]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f2e72]:
