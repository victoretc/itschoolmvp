            - heading "Как учат в АйТи Скул" [level=2] [ref=f126e157]
          - paragraph [ref=f126e158]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
