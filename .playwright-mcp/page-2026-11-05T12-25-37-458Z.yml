    - region [ref=f484e94]:
      - generic [ref=f484e95]:
        - generic [ref=f484e96]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=f484e98]
          - paragraph [ref=f484e99]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f484e100]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f484e101]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f484e102]
          - generic [ref=f484e104]:
            - generic [ref=f484e105]:
              - generic [ref=f484e106]:
                - generic [aria-hidden] [ref=f484e107]: "01"
                - paragraph [ref=f484e108]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f484e109]:
                - generic [aria-hidden] [ref=f484e110]: "02"
                - paragraph [ref=f484e111]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f484e113]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
    - region [ref=f484e114]:
