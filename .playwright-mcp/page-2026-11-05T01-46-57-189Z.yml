            - generic [ref=f89e92]:
              - generic [ref=f89e93]:
                - generic [aria-hidden] [ref=f89e94]: "01"
                - paragraph [ref=f89e95]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f89e96]:
                - generic [aria-hidden] [ref=f89e97]: "02"
                - paragraph [ref=f89e98]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f89e99]:
              - generic [ref=f89e100]: Наша главная цель
