          - generic [ref=f337e128]:
            - generic [ref=f337e129]:
              - generic [ref=f337e130]:
                - generic [aria-hidden] [ref=f337e131]: "01"
                - paragraph [ref=f337e132]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f337e133]:
                - generic [aria-hidden] [ref=f337e134]: "02"
                - paragraph [ref=f337e135]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - generic [ref=f337e136]:
              - generic [ref=f337e137]: Наша главная цель
              - paragraph [ref=f337e138]: Формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
