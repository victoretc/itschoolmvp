          - heading "Как учат в АйТи Скул" [level=2] [ref=f26e163]
          - paragraph [ref=f26e164]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
