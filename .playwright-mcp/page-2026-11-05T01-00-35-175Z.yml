          - heading "Как учат в АйТи Скул" [level=2] [ref=f13e141]
          - paragraph [ref=f13e142]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f13e143]:
          - figure "Команда АйТи Скул на фестивале Smart Robo Fest" [ref=f13e144]:
            - img "Команда АйТи Скул с наградами на фестивале Smart Robo Fest" [ref=f13e145]
          - generic [ref=f13e147]:
            - generic [ref=f13e148]:
              - paragraph [ref=f13e151]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - paragraph [ref=f13e154]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
            - paragraph [ref=f13e155]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
