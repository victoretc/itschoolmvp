baseURL = 'https://victoretc.github.io/itschoolmvp/'
languageCode = 'ru-ru'
defaultContentLanguage = 'ru'
title = 'АйТи Скул'
enableRobotsTXT = true
summaryLength = 30

[pagination]
  pagerSize = 10

[minify]
  minifyOutput = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'github-dark'

[params]
  description = 'IT-курсы в Бресте: программирование, робототехника и разработка игр для детей и подростков'
  phone = '+375 (29) 871-76-12'
  phoneHref = 'tel:+375298717612'
  # Номер счётчика Яндекс.Метрики. Скрипт загружается только после
  # согласия посетителя на аналитические файлы cookie.
  yandexMetrikaId = ''

# Полоса-объявление над шапкой. Показывается одна полоса: из включённых
# (enabled = true) выбирается та, у которой priority больше. Чтобы поменять
# объявление, выключите текущее и включите нужное. highlight — часть title,
# которую нужно подсветить жёлтым маркером.
[params.announcement]
  [[params.announcement.bars]]
    id = 'vacations'
    enabled = false
    priority = 20
    title = 'Идёт набор в IT-каникулы'
    highlight = 'IT-каникулы'
    benefits = ['Практические проекты', 'Небольшие группы', 'Дружелюбная атмосфера']
    cta = 'Записаться'
    consultTitle = 'Записаться в IT-каникулы'
    consultLead = 'Расскажем о датах смен, программе и стоимости — подберём подходящую смену для вашего ребёнка.'

  [[params.announcement.bars]]
    id = 'school-year'
    enabled = true
    priority = 10
    title = 'Идёт набор на новый учебный год'
    highlight = 'новый учебный год'
    benefits = ['Практические проекты', 'Небольшие группы', 'Дружелюбная атмосфера']
    cta = 'Записаться'
    consultTitle = 'Записаться на новый учебный год'
    consultLead = 'Подберём направление по возрасту и интересам ребёнка, расскажем о расписании и стоимости.'

[[menus.main]]
  name = 'Главная'
  url = '/'
  weight = 10
[[menus.main]]
  name = 'Курсы'
  url = '/courses/'
  weight = 20
[[menus.main]]
  name = 'IT Каникулы'
  url = '/it-vacations/'
  weight = 30
[[menus.main]]
  name = 'О нас'
  url = '/about/'
  weight = 40
# Блог временно скрыт: страница и ссылки на неё отключены.
