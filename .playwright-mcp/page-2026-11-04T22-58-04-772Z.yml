          - heading "Как учат в АйТи Скул" [level=2] [ref=f96e54]
          - paragraph [ref=f96e55]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f96e56]:
          - generic [ref=f96e57]:
            - generic [aria-hidden] [ref=f96e58]: "01"
            - paragraph [ref=f96e59]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
          - generic [ref=f96e60]:
            - generic [aria-hidden] [ref=f96e61]: "02"
            - paragraph [ref=f96e62]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
        - paragraph [ref=f96e63]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
    - region [ref=f96e64]:
