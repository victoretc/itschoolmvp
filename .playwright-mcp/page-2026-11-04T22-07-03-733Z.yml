      - generic [ref=f7e438]: "Это индивидуальное занятие и часть программы. Поэтому мы сразу определим уровень знаний, а ребёнок добьётся результата: нарисует иллюстрацию, создаст игру или программу, усвоит практические знания, которые пригодятся в будущем. Наше обучение построено так, чтобы каждый достигал цели."
      - generic [ref=f7e442]: "Предложим выбрать подходящее количество занятий: 12, 24, 48 или 100. А ещё вы всегда сможете видеть в личном кабинете или Telegram-боте, сколько осталось занятий, переносить их и пополнять баланс. Наша школа программирования делает обучение удобным для каждого ученика и семьи."
