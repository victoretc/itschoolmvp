        - article [ref=f15e420]:
          - heading "Постоянная практика" [level=3] [ref=f15e422]
          - paragraph [ref=f15e423]: Только практика превращает знания в навыки. Поэтому мы работаем над настоящими проектами, разбивая их на понятные шаги. Маленькие победы помогают видеть прогресс и не терять мотивацию.
        - article [ref=f15e424]:
