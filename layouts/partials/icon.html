{{- $name := . -}}

<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="7" width="16" height="12" rx="4"></rect><path d="M12 7V4M9 12h.01M15 12h.01M9 16h6"></path><path d="M2 11v3M22 11v3"></path></svg>
{{- else if eq $name "blocks" -}}

{{- else if eq $name "chip" -}}
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="7" y="7" width="10" height="10" rx="2"></rect><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"></path></svg>
{{- else if eq $name "code" -}}
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"></path></svg>
{{- else if eq $name "game" -}}
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 8h10a5 5 0 0 1 4.8 6.4l-.5 1.7a2.4 2.4 0 0 1-4.1 1L15 15H9l-2.2 2.1a2.4 2.4 0 0 1-4.1-1l-.5-1.7A5 5 0 0 1 7 8Z"></path><path d="M7 11v3M5.5 12.5h3M16 11.5h.01M18 13.5h.01"></path></svg>

<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"></path></svg>
