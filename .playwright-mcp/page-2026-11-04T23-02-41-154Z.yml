        - generic [ref=f103e75]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=f103e76]
          - paragraph [ref=f103e77]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f103e78]:
          - generic [ref=f103e79]:
            - generic [aria-hidden] [ref=f103e80]: "01"
            - paragraph [ref=f103e81]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
          - generic [ref=f103e82]:
            - generic [aria-hidden] [ref=f103e83]: "02"
            - paragraph [ref=f103e84]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
        - paragraph [ref=f103e85]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
    - region [ref=f103e86]:
      - generic [ref=f103e87]:
        - heading "Для чего ребенку компьютерное образование?" [level=2] [ref=f103e88]
        - generic [ref=f103e89]:
          - generic [ref=f103e90]:
            - generic [aria-hidden] [ref=f103e91]: "01"
            - heading "Развитие потенциала" [level=3] [ref=f103e92]
            - paragraph [ref=f103e93]: Работа с компьютером это инструмент интеллектуальной работы, помогающий в развитии интеллектуально-творческого потенциала личности, что позволит быстрее адаптироваться к различным условиям жизни, находить нестандартные решения любых возникающих задач.
          - generic [ref=f103e94]:
            - generic [aria-hidden] [ref=f103e95]: "02"
            - heading "Профориентация" [level=3] [ref=f103e96]
            - paragraph [ref=f103e97]: "Курс построен таким образом, что тинейджеры могут попробовать себя в разных ролях в IT: от тестировщика до программиста."
          - generic [ref=f103e98]:
            - generic [aria-hidden] [ref=f103e99]: "03"
            - heading "Ранний старт в IT" [level=3] [ref=f103e100]
            - paragraph [ref=f103e101]: Ребята смогут получить реальный опыт и свою первую профессию еще в школе, создавая и развивая настоящий проект.
    - region [ref=f103e102]:
      - generic [ref=f103e103]:
        - generic [ref=f103e104]:
          - heading "Выбирайте подходящий курс" [level=2] [ref=f103e105]
          - paragraph [ref=f103e106]: Кратко рассказываем о каждом курсе
        - generic [ref=f103e107]:
          - generic [ref=f103e108]:
            - group [ref=f103e109]:
              - generic "Робототехника LEGO" [active] [ref=f103e110] [cursor=pointer]:
                - generic [aria-hidden] [ref=f103e111]: "01"
              - generic [ref=f103e188]:
                - paragraph [ref=f103e189]: LEGO WeDo, WeDo 2.0, EV3 - идеальный старт для изучения робототехники с 7-ми лет. Занятия по робототехнике развивают творческое и логическое мышление, ответственность, усидчивость, терпеливость, целеустремленность, память и мелкую моторику.
                - paragraph [ref=f103e190]: В процессе занятий дети учатся действовать логически, принимать взвешенные решения, прислушиваться к чужому мнению, работать сообща, доводить начатое до конца.
                - paragraph [ref=f103e191]: Платформа LEGO WeDo создана для эффективного изучения технических дисциплин уже в начальной школе. Она позволяет собирать и программировать простые робототехнические модели, которые подключаются к компьютеру. Для управления моделями используется специальное программное обеспечение, основанное на визуальном языке программирования, понятном даже дошкольнику.
                - paragraph [ref=f103e192]: Платформа LEGO WeDo 2.0 - расширенная версия платформы WeDo. Она создана для развития у детей навыков алгоритмического мышления, необходимых в дальнейшем освоении программирования, и вовлечения их в изучение точных наук через практическую деятельность. WeDo 2.0 включает в себя материалы для реализации 17 проектов по окружающему миру, биологии, географии, исследованию космоса и инженерному проектированию - через исследование, моделирование и конструирование робототехнических моделей.
                - paragraph [ref=f103e193]: Платформа LEGO Mindstorms EV3 позволяет ученикам создавать, программировать и тестировать свои решения, используя реальные технологии из мира робототехники. С её помощью легко и просто совершенствовать знания в области информатики, физики, технологии и математики, при этом развивая критически важные для XXI века навыки и умения.
