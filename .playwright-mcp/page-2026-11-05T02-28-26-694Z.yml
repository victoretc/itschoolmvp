              - generic [ref=f341e130]:
                - generic [aria-hidden] [ref=f341e131]: "01"
                - paragraph [ref=f341e132]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
              - generic [ref=f341e133]:
                - generic [aria-hidden] [ref=f341e134]: "02"
                - paragraph [ref=f341e135]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
