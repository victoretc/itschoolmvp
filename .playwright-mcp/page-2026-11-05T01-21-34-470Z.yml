          - heading "Как учат в АйТи Скул" [level=2] [ref=f2e165]
          - paragraph [ref=f2e166]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
