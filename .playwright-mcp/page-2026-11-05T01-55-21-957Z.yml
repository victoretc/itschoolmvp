          - heading "Как учат в АйТи Скул" [level=2] [ref=f141e90]
          - paragraph [ref=f141e91]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
