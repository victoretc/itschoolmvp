    - region [ref=f94e73]:
      - generic [ref=f94e74]:
        - generic [ref=f94e75]:
          - heading "Как учат в АйТи Скул" [level=2] [ref=f94e76]
          - paragraph [ref=f94e77]: В АйТи Скул мы используем программируемые конструкторы LEGO и робототехнические наборы Arduino для обучения детей с 6 лет.
        - generic [ref=f94e78]:
          - generic [ref=f94e79]:
            - generic [aria-hidden] [ref=f94e80]: "01"
            - paragraph [ref=f94e81]: Мы собрали команду преподавателей из числа брестских специалистов по робототехнике, опытных предпринимателей и менеджеров из IT-отрасли, чтобы решить амбициозную задачу — обеспечить нашим детям возможность развиваться с использованием новейших и инновационных образовательных технологий.
          - generic [ref=f94e82]:
            - generic [aria-hidden] [ref=f94e83]: "02"
            - paragraph [ref=f94e84]: Наша учебная программа разработана специалистами, которые зарекомендовали себя как в Республике Беларусь, так и на международной арене. Педагоги АйТи Скул прошли специальную подготовку и сертификацию по использованию оборудования LEGO в образовательном процессе.
        - paragraph [ref=f94e85]: Наша главная цель — формирование профессиональных кадров для IT-отрасли уже со школьной скамьи.
    - region [ref=f94e86]:
      - generic [ref=f94e87]:
        - heading "Для чего ребенку компьютерное образование?" [level=2] [ref=f94e88]
        - generic [ref=f94e89]:
          - generic [ref=f94e90]:
            - generic [aria-hidden] [ref=f94e91]: "01"
            - heading "Развитие потенциала" [level=3] [ref=f94e92]
            - paragraph [ref=f94e93]: Работа с компьютером это инструмент интеллектуальной работы, помогающий в развитии интеллектуально-творческого потенциала личности, что позволит быстрее адаптироваться к различным условиям жизни, находить нестандартные решения любых возникающих задач.
          - generic [ref=f94e94]:
            - generic [aria-hidden] [ref=f94e95]: "02"
            - heading "Профориентация" [level=3] [ref=f94e96]
            - paragraph [ref=f94e97]: "Курс построен таким образом, что тинейджеры могут попробовать себя в разных ролях в IT: от тестировщика до программиста."
          - generic [ref=f94e98]:
            - generic [aria-hidden] [ref=f94e99]: "03"
            - heading "Ранний старт в IT" [level=3] [ref=f94e100]
            - paragraph [ref=f94e101]: Ребята смогут получить реальный опыт и свою первую профессию еще в школе, создавая и развивая настоящий проект.